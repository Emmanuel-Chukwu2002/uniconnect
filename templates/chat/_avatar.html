{% comment %}A round avatar: photo, or initials on a colour. p = a services.person() / title_and_avatar() dict.{% endcomment %}<span class="wa-avatar {{ extra }}{% if p.is_group %} is-group{% endif %}" style="--size:{{ size|default:49 }}px;{% if p.photo %}background-image:url('{{ p.photo }}'){% elif not p.is_group %}background-color:{{ p.colour }}{% endif %}">{% if not p.photo %}{% if p.is_group %}<i class="bi {% if p.is_announcement %}bi-megaphone-fill{% else %}bi-people-fill{% endif %}"></i>{% else %}{{ p.initials }}{% endif %}{% endif %}</span>
