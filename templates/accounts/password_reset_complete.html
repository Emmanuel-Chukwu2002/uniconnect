{% extends 'accounts/auth_base.html' %}
{% block title %}Password changed — UniConnect{% endblock %}
{% block auth_body %}
{% include 'accounts/_solo_head.html' %}
<main class="lp-solo">
  <div class="lp-card">
    <span class="lp-badge is-ok"><i class="bi bi-check2-circle"></i></span>
    <h2>Password changed</h2>
    <p class="lp-sub">Your new password is saved. Sign in with it now.</p>
    <a href="{% url 'login' %}" class="lp-submit">Sign In</a>
  </div>
</main>
{% endblock %}
