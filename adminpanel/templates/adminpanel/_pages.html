{% if page.paginator.num_pages > 1 %}
<div class="ad-pages">
  <span>Page {{ page.number }} of {{ page.paginator.num_pages }} · {{ page.paginator.count }} total</span>
  <div>
    {% if page.has_previous %}<a class="ad-btn sm" href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&amp;{% endif %}{% endfor %}page={{ page.previous_page_number }}">Previous</a>{% endif %}
    {% if page.has_next %}<a class="ad-btn sm" href="?{% for k, v in request.GET.items %}{% if k != 'page' %}{{ k }}={{ v|urlencode }}&amp;{% endif %}{% endfor %}page={{ page.next_page_number }}">Next</a>{% endif %}
  </div>
</div>
{% endif %}
